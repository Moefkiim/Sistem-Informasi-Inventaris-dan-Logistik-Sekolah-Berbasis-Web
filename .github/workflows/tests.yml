name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: SQLite (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite3, pdo_sqlite, dom, fileinfo, curl, ctype, filter, gd, iconv, simplexml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Verify platform requirements
        run: composer check-platform-reqs

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run tests
        run: php artisan test

  mysql-install:
    name: MySQL/MariaDB (${{ matrix.db }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            db: 'mysql:8.0'
          - php: '8.4'
            db: 'mariadb:10.11'
          - php: '8.3'
            db: 'mysql:8.0'

    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: siils_ci
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, dom, fileinfo, curl, ctype, filter, gd, iconv, simplexml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Verify platform requirements
        run: composer check-platform-reqs

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Install (otomatis membuat database siils_ci, migrate, seed)
        run: php artisan siils:install --force

      - name: Periksa prasyarat setelah instalasi
        run: php artisan siils:check

      - name: Instalasi ulang (membuktikan idempoten)
        run: php artisan siils:install --force

      - name: Run tests on MySQL/MariaDB
        run: php artisan test

      - name: Uji prosedur optimize dan smoke check konfigurasi ter-cache
        run: |
          php artisan optimize
          php artisan about
          php artisan route:list --except-vendor
          php artisan siils:check
          php artisan optimize:clear

      - name: Pastikan klien MySQL tersedia
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi

      - name: Uji round-trip backup (MySQL/MariaDB)
        run: bash ci/backup-roundtrip.sh

      - name: Uji siils:backup dengan MYSQLDUMP_PATH dan config:cache aktif
        run: |
          MYSQLDUMP_BIN=$(which mysqldump)
          echo "MYSQLDUMP_PATH=$MYSQLDUMP_BIN" >> .env
          php artisan config:cache
          php artisan siils:backup --path=storage/app/backups --keep=1
          php artisan config:clear

      - name: Uji SIILS_ALLOW_DEMO_SEED di produksi dengan config:cache aktif
        run: |
          echo "SIILS_ALLOW_DEMO_SEED=true" >> .env
          APP_ENV=production php artisan config:cache
          APP_ENV=production php artisan db:seed --class="Database\\Seeders\\DatabaseSeeder" --force
          php artisan config:clear

  composer-setup:
    name: Composer setup dari clone bersih + smoke per role (PHP 8.4, MySQL 8.0)
    runs-on: ubuntu-24.04

    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: siils_ci
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, dom, fileinfo, curl, ctype, filter, gd, iconv, simplexml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Composer setup (buat .env, APP_KEY, database, migrate, seed - persis README B.7)
        run: composer setup

      - name: Periksa prasyarat setelah composer setup
        run: php artisan siils:check

      - name: Uji asap per role (Kajur, Sarpras, Kepala Sekolah, akun nonaktif)
        run: php artisan test --filter=DemoReadinessTest

  browser-smoke:
    name: Browser smoke via Playwright/Python (PHP 8.4, MySQL 8.0)
    runs-on: ubuntu-24.04

    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: siils_ci
      DB_USERNAME: root
      DB_PASSWORD: password
      APP_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, dom, fileinfo, curl, ctype, filter, gd, iconv, simplexml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Install (buat DB siils_ci, migrate, seed data demo)
        run: php artisan siils:install --force

      - name: Jalankan server aplikasi
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel-browser-smoke.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/up >/dev/null 2>&1; then echo "Server siap"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/up

      - name: Siapkan Python + Playwright + axe-core (hanya di CI)
        run: |
          python3 -m ensurepip --upgrade || true
          python3 -m pip install --upgrade pip
          python3 -m pip install "playwright>=1.45,<2" axe-playwright-python
          python3 -m playwright install --with-deps chromium

      - name: Jalankan browser smoke (tests/Browser/smoke.py)
        run: |
          python3 tests/Browser/smoke.py \
            --base-url "http://127.0.0.1:8000" \
            --artifact-dir "storage/logs/browser-smoke" \
            > storage/logs/browser-smoke-run.log 2>&1 || { cat storage/logs/browser-smoke-run.log; exit 1; }

      - name: Ringkasan aksesibilitas (axe-core)
        if: always()
        run: |
          if [ -f storage/logs/browser-smoke/a11y-report.json ]; then
            echo "=== a11y-report.json (ringkasan) ==="
            python3 -c "import json;d=json.load(open('storage/logs/browser-smoke/a11y-report.json'));print('total temuan:',d['total_violations']);print('per dampak:',d['by_impact']);[print('  [%s] %s x%d - %s' % (r['impact'],r['rule'],r['count'],r['help'])) for r in d['by_rule']]"
          else
            echo "a11y-report.json belum tersedia"
          fi

      - name: Tampilkan ringkasan browser smoke
        run: |
          tail -30 storage/logs/browser-smoke-run.log || true

      - name: Unggah screenshot, trace, dan indeks sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: storage/logs/browser-smoke
          retention-days: 14
